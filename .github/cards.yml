name: Refresh profile cards

on:
  schedule:
    - cron: "17 2 * * *"        # every day, 02:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/profile.json"
      - "assets/**"
      - ".github/workflows/cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch contributions
        env:
          # Add a PROFILE_TOKEN secret (classic PAT, read:user) to include private contributions.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render cards
        run: python scripts/render_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data/contributions.json
          if git diff --cached --quiet; then
            echo "Cards unchanged"
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
